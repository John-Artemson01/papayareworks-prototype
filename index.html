<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>papayareworks | Official Store</title>
    
    <!-- Tailwind CSS (CDN for prototyping) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration for Brand Colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandYellow: '#FFF2C5',
                        brandBlack: '#1A1A1A',
                        gridGray: '#F4F4F4',
                    },
                    fontFamily: {
                        sans: ['Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-white text-brandBlack antialiased">

    <!-- Top Utility Banner -->
    <div class="bg-brandYellow text-center p-2 text-xs tracking-widest uppercase font-bold text-brandBlack">
        Free shipping on all orders over $150
    </div>

    <!-- Main Navigation -->
    <header class="flex justify-between items-center py-5 px-10 border-b border-gray-200 sticky top-0 bg-white z-50">
        <ul class="hidden md:flex gap-6 text-sm uppercase tracking-wide">
            <li><a href="#" class="hover:text-gray-500 transition-colors">Shop All</a></li>
            <li><a href="#" class="hover:text-gray-500 transition-colors">Patchwork</a></li>
            <li><a href="#" class="hover:text-gray-500 transition-colors">Appliqué</a></li>
        </ul>
        
        <div class="h-16 flex items-center justify-center">
            <a href="#">
                <img src="assets/image_80c89f.jpg" alt="Papaya Reworks Logo" class="h-full object-contain">
            </a>
        </div>

        <ul class="flex gap-6 text-sm uppercase tracking-wide">
            <li class="cursor-pointer hover:text-gray-500 transition-colors">Search</li>
            <li class="hidden md:block cursor-pointer hover:text-gray-500 transition-colors">Account</li>
            <li class="cursor-pointer hover:text-gray-500 transition-colors">Cart (0)</li>
        </ul>
    </header>

    <!-- Hero Banner -->
    <section class="h-[70vh] bg-gridGray flex flex-col items-center justify-center text-center px-4 relative group">
        <h1 class="text-4xl md:text-6xl uppercase font-bold tracking-tight mb-8 z-10">The Spring Collection</h1>
        <a href="#shop" class="bg-brandBlack text-white uppercase font-bold tracking-widest py-4 px-8 hover:bg-brandYellow hover:text-brandBlack transition-all duration-300 z-10">
            Shop Now
        </a>
    </section>

    <!-- Product Grid -->
    <section id="shop" class="py-16 px-6 md:px-10">
        <h2 class="text-center text-2xl uppercase tracking-widest mb-10 font-bold">New Arrivals</h2>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-8">
            <!-- Product 1 -->
            <div class="group cursor-pointer product-card">
                <div class="bg-gridGray aspect-[4/5] overflow-hidden mb-4 relative">
                    <img src="assets/image_80c841.jpg" alt="White Floral Tie-Up Shirt" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                </div>
                <div class="flex justify-between text-sm">
                    <span class="uppercase">Floral Tie-Up Shirt</span>
                    <span class="font-bold">$85</span>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="group cursor-pointer product-card">
                <div class="bg-gridGray aspect-[4/5] overflow-hidden mb-4 relative">
                    <img src="assets/image_80c825.jpg" alt="Lavender Airplane Felt Shirt" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                </div>
                <div class="flex justify-between text-sm">
                    <span class="uppercase">Airplane Felt Shirt</span>
                    <span class="font-bold">$95</span>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="group cursor-pointer product-card">
                <div class="bg-gridGray aspect-[4/5] overflow-hidden mb-4 relative">
                    <img src="assets/image_80c806.jpg" alt="Pink Gingham Strawberry Vest" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                </div>
                <div class="flex justify-between text-sm">
                    <span class="uppercase">Gingham Strawberry Vest</span>
                    <span class="font-bold">$110</span>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="group cursor-pointer product-card">
                <div class="bg-gridGray aspect-[4/5] overflow-hidden mb-4 relative">
                    <img src="assets/image_80c7e9.jpg" alt="Mixed Pattern Patchwork Shirt" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                </div>
                <div class="flex justify-between text-sm">
                    <span class="uppercase">Mixed Patchwork Shirt</span>
                    <span class="font-bold">$90</span>
                </div>
            </div>
            
             <!-- Product 5 -->
             <div class="group cursor-pointer product-card">
                <div class="bg-gridGray aspect-[4/5] overflow-hidden mb-4 relative">
                    <img src="assets/image_80c7c8.jpg" alt="Striped Shirt with Pink Collar" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                </div>
                <div class="flex justify-between text-sm">
                    <span class="uppercase">Pink Collar Striped Shirt</span>
                    <span class="font-bold">$80</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Custom JS -->
    <script src="public/script.js"></script>
</body>
</html>
