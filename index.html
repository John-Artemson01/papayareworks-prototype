<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>papayareworks | Lookbook</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandYellow: '#FFF2C5',   
                        brandBlack: '#1A1A1A',    
                        cardWhite: '#FFFFFF',     
                        strawberryRed: '#E83D3A', 
                        papayaOrange: '#FF9800',  
                        leafGreen: '#4CAF50',     
                        bubblegumPink: '#FF99C8', 
                    },
                    fontFamily: {
                        sans: ['"Fredoka"', 'sans-serif'],
                    },
                    boxShadow: {
                        'chunky': '4px 4px 0px 0px #1A1A1A',
                        'chunky-hover': '8px 8px 0px 0px #1A1A1A',
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-brandYellow text-brandBlack antialiased overflow-x-hidden">

    <!-- Top Utility Banner -->
    <div class="bg-strawberryRed text-white text-center p-3 text-sm tracking-wider uppercase font-bold border-b-4 border-brandBlack z-50 relative">
        Worldwide Shipping Available 🍓
    </div>

    <!-- Main Navigation -->
    <header class="flex justify-between items-center py-4 px-8 border-b-4 border-brandBlack sticky top-0 bg-cardWhite z-40 shadow-sm">
        <ul class="hidden md:flex gap-8 text-base uppercase font-semibold">
            <li><a href="#catalog" class="hover:text-bubblegumPink transition-colors">Catalog</a></li>
            <!-- Temporarily hidden: Order Form -->
            <!-- <li><a href="#" class="hover:text-papayaOrange transition-colors">Order Form</a></li> -->
            <li><a href="#" class="hover:text-leafGreen transition-colors">New Arrival</a></li>
        </ul>
        
        <div class="flex items-center justify-center">
            <a href="#" class="block h-16">
                <img src="assets/image_80c89f.jpg" alt="Papaya Reworks Logo" class="h-full w-auto object-contain drop-shadow-md hover:scale-105 transition-transform mix-blend-multiply">
            </a>
        </div>

        <ul class="flex gap-8 text-base uppercase font-semibold">
            <!-- Temporarily hidden: Search -->
            <!-- <li class="cursor-pointer hover:text-papayaOrange transition-colors">Search</li> -->
            <li class="cursor-pointer hover:text-strawberryRed transition-colors"><a href="https://instagram.com/papayareworks" target="_blank">IG</a></li>
            
            <!-- Dynamic Gmail Dropdown -->
            <li class="relative cursor-pointer transition-colors group">
                <span id="gmail-toggle" class="hover:text-bubblegumPink transition-colors">Gmail &darr;</span>
                
                <div id="gmail-dropdown" class="absolute right-0 mt-4 w-56 bg-cardWhite border-4 border-brandBlack rounded-2xl shadow-chunky hidden flex-col z-50 overflow-hidden">
                    <button id="local-order-btn" class="px-4 py-4 text-left font-bold uppercase text-brandBlack hover:bg-papayaOrange border-b-4 border-brandBlack transition-colors text-sm">
                        Local Order
                    </button>
                    <button id="intl-order-btn" class="px-4 py-4 text-left font-bold uppercase text-brandBlack hover:bg-bubblegumPink transition-colors text-sm">
                        Intl Order
                    </button>
                </div>
            </li>
        </ul>
    </header>

    <!-- 1. Hero Banner -->
    <section class="h-[60vh] bg-[url('assets/image_80c89f.jpg')] bg-cover bg-center bg-no-repeat border-b-4 border-brandBlack flex flex-col items-center justify-center text-center px-4 relative overflow-hidden">
        <div class="absolute inset-0 bg-brandYellow/50 mix-blend-multiply"></div>

        <h1 class="text-4xl md:text-6xl uppercase font-bold mb-8 z-10 tracking-wide text-brandBlack bg-cardWhite border-4 border-brandBlack py-4 px-8 rounded-2xl shadow-chunky transform -rotate-2">
            The Papaya Collection
        </h1>
        
        <a href="#catalog" class="bg-papayaOrange text-brandBlack border-4 border-brandBlack rounded-full uppercase font-bold text-xl py-4 px-10 shadow-chunky hover:shadow-chunky-hover hover:bg-cardWhite hover:-translate-y-1 transition-all duration-200 z-10">
            View Lookbook
        </a>
    </section>

    <!-- 2. Trending Now (Horizontal Scroll) -->
    <section class="py-16 px-6 md:px-10 max-w-[1600px] mx-auto border-b-4 border-brandBlack">
        <div class="flex justify-between items-end mb-8">
            <h2 class="text-3xl md:text-5xl uppercase font-bold tracking-wide text-brandBlack">Featured Pieces 🔥</h2>
            <div class="hidden md:flex gap-4">
                <button id="scroll-left" class="w-12 h-12 rounded-full border-4 border-brandBlack bg-cardWhite shadow-chunky hover:bg-bubblegumPink flex items-center justify-center text-xl font-bold transition-colors">&larr;</button>
                <button id="scroll-right" class="w-12 h-12 rounded-full border-4 border-brandBlack bg-cardWhite shadow-chunky hover:bg-bubblegumPink flex items-center justify-center text-xl font-bold transition-colors">&rarr;</button>
            </div>
        </div>
        
        <!-- Horizontal Scroll Container -->
        <div id="featured-container" class="flex overflow-x-auto gap-6 pb-8 snap-x snap-mandatory hide-scrollbar scroll-smooth">
            <!-- JS will inject featured cards here -->
        </div>
    </section>

    <!-- 3. New Arrival -->
    <section class="py-16 px-6 md:px-10 max-w-[1600px] mx-auto border-b-4 border-brandBlack">
        <h2 class="text-3xl md:text-5xl uppercase font-bold mb-10 tracking-wide text-brandBlack">New Arrival ✨</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-10">
            <!-- Different Artist -->
            <div class="group relative aspect-square md:aspect-[4/5] rounded-3xl border-4 border-brandBlack overflow-hidden shadow-chunky cursor-pointer bg-bubblegumPink category-btn">
                <img src="assets/1000020776.jpg" alt="Different Artist" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                <div class="absolute inset-0 bg-brandBlack bg-opacity-10 group-hover:bg-opacity-30 transition-all"></div>
                <div class="absolute bottom-6 left-6 md:bottom-10 md:left-10">
                    <span class="bg-cardWhite text-brandBlack border-4 border-brandBlack rounded-full px-6 py-3 uppercase font-bold text-xl shadow-[4px_4px_0_0_#1A1A1A] group-hover:bg-papayaOrange transition-colors">View Different Artist</span>
                </div>
            </div>
            
            <!-- Reverie Collection -->
            <div class="group relative aspect-square md:aspect-[4/5] rounded-3xl border-4 border-brandBlack overflow-hidden shadow-chunky cursor-pointer bg-leafGreen category-btn">
                <img src="assets/1000020773.jpg" alt="Reverie Collection" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                <div class="absolute inset-0 bg-brandBlack bg-opacity-10 group-hover:bg-opacity-30 transition-all"></div>
                <div class="absolute bottom-6 left-6 md:bottom-10 md:left-10">
                    <span class="bg-cardWhite text-brandBlack border-4 border-brandBlack rounded-full px-6 py-3 uppercase font-bold text-xl shadow-[4px_4px_0_0_#1A1A1A] group-hover:bg-bubblegumPink transition-colors">View Reverie Collection</span>
                </div>
            </div>

            <!-- Appliqué -->
            <div class="group relative aspect-square md:aspect-[4/5] rounded-3xl border-4 border-brandBlack overflow-hidden shadow-chunky cursor-pointer bg-strawberryRed category-btn">
                <img src="assets/1000020753.jpg" alt="Explore Applique" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                <div class="absolute inset-0 bg-brandBlack bg-opacity-10 group-hover:bg-opacity-30 transition-all"></div>
                <div class="absolute bottom-6 left-6 md:bottom-10 md:left-10">
                    <span class="bg-cardWhite text-brandBlack border-4 border-brandBlack rounded-full px-6 py-3 uppercase font-bold text-xl shadow-[4px_4px_0_0_#1A1A1A] group-hover:bg-leafGreen transition-colors">View Appliqué</span>
                </div>
            </div>
        </div>
    </section>

    <!-- 4. Latest Drops / Full Catalog Grid -->
    <section id="catalog" class="py-16 px-6 md:px-10 max-w-[1600px] mx-auto">
        <h2 class="text-3xl md:text-5xl uppercase font-bold mb-10 tracking-wide text-brandBlack text-center">Latest Drops 💧</h2>
        
        <!-- Grid Container -->
        <div id="latest-drops-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
             <!-- JS will inject latest drops cards here -->
        </div>
        
        <!-- View All Button -->
        <div class="text-center mt-12">
            <button id="view-archive-btn" class="bg-brandBlack text-cardWhite border-4 border-brandBlack rounded-full py-4 px-12 font-bold uppercase text-xl shadow-chunky hover:shadow-chunky-hover hover:bg-strawberryRed hover:-translate-y-1 transition-all duration-200">
                View Full Archive
            </button>
        </div>
    </section>

    <!-- Custom JS -->
    <script src="public/script.js"></script>
</body>
</html>
